services:
  web:
    build:
      context: ..
    image: bogey-web
    env_file: ../.env
    environment:
      BOGEY_TRUST_PROXY: "1"
    volumes:
      - ../bogey.config.ts:/app/bogey.config.ts:ro
    restart: unless-stopped
    # extra_hosts:
    #   - supabase.example.org:host-gateway

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BOGEY_HOST: ${BOGEY_HOST:-localhost}
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

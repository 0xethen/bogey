services:
  auth:
    environment:
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: "true"
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: "pg-functions://postgres/private/before_user_created"
      GOTRUE_HOOK_SEND_EMAIL_ENABLED: "true"
      GOTRUE_HOOK_SEND_EMAIL_URI: "${BOGEY_URL:?set BOGEY_URL in Supabase's .env}/api/auth/send-email"
      GOTRUE_HOOK_SEND_EMAIL_SECRETS: "${SEND_EMAIL_HOOK_SECRET:?set SEND_EMAIL_HOOK_SECRET in Supabase's .env}"
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "true"
      GOTRUE_MAILER_EXTERNAL_HOSTS: "${BOGEY_HOSTS:-}"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      # passkeys as a second factor; give the web app the same BOGEY_PASSKEY_HOST
      GOTRUE_MFA_WEB_AUTHN_ENROLL_ENABLED: "true"
      GOTRUE_MFA_WEB_AUTHN_VERIFY_ENABLED: "true"
      GOTRUE_WEBAUTHN_RP_ID: "${BOGEY_PASSKEY_HOST:-}"
      GOTRUE_WEBAUTHN_RP_DISPLAY_NAME: "Bogey"
      GOTRUE_WEBAUTHN_RP_ORIGINS: "https://${BOGEY_PASSKEY_HOST:-}"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
    <title>{{subject}}</title>
    <style>
      body { margin: 0; padding: 0; background: #F6F6F6; }
      a { color: {{accent}}; }
      @media (max-width: 620px) {
        .card { border-radius: 14px !important; }
        .outer { padding: 20px 12px !important; }
        .codebox { font-size: 26px !important; letter-spacing: 5px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background:#F6F6F6">
    <table role="presentation" class="page" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F6F6F6">
      <tr>
        <td class="outer" align="center" style="padding:36px 16px">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px">
            <tr>
              <td style="padding:0 4px 18px">{{brand}}</td>
            </tr>
            <tr>
              <td class="card text" style="padding:25px 20px;background:#ffffff;border:1px solid #e7e5e4;border-radius:16px;color:#1c1917;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
                {{content}}
              </td>
            </tr>
            <tr>
              <td style="padding:20px 8px 0;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
                {{footer}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
